<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="tab.title">Neuer Tab</title>
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
  <script src="themes.js"></script>
</head>
<body>
  <header class="top">
    <div class="clock">
      <div id="localTime" class="clock-time">--:--<span class="sec">:--</span></div>
      <div class="clock-meta">
        <div id="localDate" class="clock-date"></div>
        <div id="localZone" class="clock-zone"></div>
      </div>
    </div>
    <div class="legend">
      <span><i class="dot dot-city"></i><span data-i18n="legend.city">Stadt</span></span>
      <span><i class="dot dot-local"></i><span data-i18n="legend.local">Deine Zeitzone</span></span>
      <span id="legendSun"><i class="dot dot-sun"></i><span data-i18n="legend.sun">Sonne im Zenit</span></span>
      <span id="legendMoon"><i class="dot dot-moon"></i><span data-i18n="legend.moon">Mond im Zenit</span></span>
      <span id="legendIss" hidden><svg class="iss-icon" viewBox="0 0 20 10" width="20" height="10" aria-hidden="true"><path class="iss-truss" d="M1 5h18"/><rect class="iss-panel" x="1" y="1" width="6" height="8" rx="0.5"/><rect class="iss-panel" x="13" y="1" width="6" height="8" rx="0.5"/><rect class="iss-body" x="8" y="3" width="4" height="4" rx="0.8"/></svg>ISS</span>
      <span id="legendQuake" hidden><i class="dot dot-quake"></i><span data-i18n="legend.quake">Erdbeben (24 h)</span></span>
      <span id="legendAurora" hidden><i class="dot dot-aurora"></i><span data-i18n="legend.aurora">Polarlicht</span></span>
      <span id="legendStorm" hidden><svg class="storm-icon" viewBox="-10 -10 20 20" width="14" height="14" aria-hidden="true"><path d="M3.6 0Q3.6-9-5.4-8.6M-3.6 0Q-3.6 9 5.4 8.6M3.6 0A3.6 3.6 0 1 1-3.6 0A3.6 3.6 0 1 1 3.6 0"/></svg><span data-i18n="legend.storm">Wirbelsturm</span></span>
      <span id="legendWork" hidden><svg class="work-icon" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect class="work-handle" x="4" y="1.6" width="4" height="2.4"/><rect x="0" y="4" width="12" height="8" rx="1.4"/></svg><span data-i18n="legend.work">Arbeitszeit</span></span>
      <button id="settingsBtn" class="icon-btn" title="Einstellungen" aria-label="Einstellungen" data-i18n-attr="title:settings; aria-label:settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="mapWrap" class="map-wrap">
    <div id="mapBox" class="map-box">
      <canvas id="map" aria-label="Weltkarte mit aktuellen Uhrzeiten" data-i18n-attr="aria-label:map.aria"></canvas>
      <div id="mapTooltip" class="map-tooltip" role="tooltip" hidden></div>
      <div id="bands" class="bands" aria-label="Uhrzeit je UTC-Zeitzone" data-i18n-attr="aria-label:bands.aria"></div>
    </div>
  </main>

  <script src="cities.js"></script>
  <script src="weather.js"></script>
  <script src="iss.js"></script>
  <script src="earthquakes.js"></script>
  <script src="aurora.js"></script>
  <script src="storms.js"></script>
  <script src="app.js"></script>
</body>
</html>
