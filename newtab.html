<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neuer Tab</title>
  <link rel="stylesheet" href="style.css">
  <script src="themes.js"></script>
</head>
<body>
  <header class="top">
    <div class="clock">
      <div id="localTime" class="clock-time">--:--<span class="sec">:--</span></div>
      <div class="clock-meta">
        <div id="localDate" class="clock-date"></div>
        <div id="localZone" class="clock-zone"></div>
      </div>
    </div>
    <div class="legend">
      <span><i class="dot dot-city"></i>Stadt</span>
      <span><i class="dot dot-local"></i>Deine Zeitzone</span>
      <span><i class="dot dot-sun"></i>Sonne im Zenit</span>
      <button id="settingsBtn" class="icon-btn" title="Einstellungen" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="mapWrap" class="map-wrap">
    <div id="mapBox" class="map-box">
      <canvas id="map" aria-label="Weltkarte mit aktuellen Uhrzeiten"></canvas>
      <div id="bands" class="bands" aria-label="Uhrzeit je UTC-Zeitzone"></div>
    </div>
  </main>

  <script src="cities.js"></script>
  <script src="app.js"></script>
</body>
</html>
