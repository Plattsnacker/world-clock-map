<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="opt.pageTitle">Weltzeit-Karte – Einstellungen</title>
  <link rel="stylesheet" href="options.css">
  <script src="i18n.js"></script>
  <script src="themes.js"></script>
</head>
<body>
  <div class="page">
    <header class="head">
      <div>
        <h1 data-i18n="app.name">Weltzeit-Karte</h1>
        <p class="sub" data-i18n="opt.sub"></p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </header>

    <section class="section" aria-labelledby="themeTitle">
      <h2 id="themeTitle" class="section-title" data-i18n="opt.theme"></h2>
      <div id="themeList" class="theme-list" role="radiogroup" aria-labelledby="themeTitle"></div>

      <div id="themeEditor" class="theme-editor" hidden>
        <div class="editor-head">
          <h3 data-i18n="opt.editor"></h3>
          <label class="copy-from"><span data-i18n="opt.copyFrom"></span>
            <select id="copyFrom"></select>
          </label>
        </div>
        <div id="editorFields" class="editor-fields"></div>
      </div>
    </section>

    <section class="section display-section" aria-labelledby="displayTitle">
      <h2 id="displayTitle" class="section-title" data-i18n="opt.display"></h2>
      <div class="toggle choice">
        <span>
          <span class="toggle-label" id="langLabel" data-i18n="opt.language"></span>
          <span class="toggle-hint" data-i18n="opt.languageHint"></span>
        </span>
        <select id="lang" aria-labelledby="langLabel"></select>
      </div>
      <label class="toggle">
        <input id="showSun" type="checkbox">
        <span>
          <span class="toggle-label" data-i18n="opt.showSun"></span>
          <span class="toggle-hint" data-i18n="opt.showSunHint"></span>
        </span>
      </label>
      <label class="toggle">
        <input id="showMoon" type="checkbox">
        <span>
          <span class="toggle-label" data-i18n="opt.showMoon"></span>
          <span class="toggle-hint" data-i18n="opt.showMoonHint"></span>
        </span>
      </label>
      <label class="toggle">
        <input id="showIss" type="checkbox">
        <span>
          <span class="toggle-label" data-i18n="opt.showIss"></span>
          <span class="toggle-hint" data-i18n-html="opt.showIssHint"></span>
        </span>
      </label>
      <label class="toggle">
        <input id="showQuakes" type="checkbox">
        <span>
          <span class="toggle-label" data-i18n="opt.showQuakes"></span>
          <span class="toggle-hint" data-i18n-html="opt.showQuakesHint"></span>
        </span>
      </label>
      <div class="toggle choice sub-option" id="quakeMinMagRow">
        <span>
          <span class="toggle-label" id="quakeMinMagLabel" data-i18n="opt.quakeMinMag"></span>
          <span class="toggle-hint" data-i18n="opt.quakeMinMagHint"></span>
        </span>
        <select id="quakeMinMag" aria-labelledby="quakeMinMagLabel"></select>
      </div>
      <label class="toggle">
        <input id="showAurora" type="checkbox">
        <span>
          <span class="toggle-label" data-i18n="opt.showAurora"></span>
          <span class="toggle-hint" data-i18n-html="opt.showAuroraHint"></span>
        </span>
      </label>
      <label class="toggle">
        <input id="centerNoon" type="checkbox">
        <span>
          <span class="toggle-label" data-i18n="opt.centerNoon"></span>
          <span class="toggle-hint" data-i18n="opt.centerNoonHint"></span>
        </span>
      </label>
      <label class="toggle">
        <input id="showFlags" type="checkbox">
        <span>
          <span class="toggle-label" data-i18n="opt.showFlags"></span>
          <span class="toggle-hint" data-i18n="opt.showFlagsHint"></span>
        </span>
      </label>
      <label class="toggle">
        <input id="showWeather" type="checkbox">
        <span>
          <span class="toggle-label" data-i18n="opt.showWeather"></span>
          <span class="toggle-hint" data-i18n-html="opt.showWeatherHint"></span>
        </span>
      </label>
      <div class="toggle choice">
        <span>
          <span class="toggle-label" id="clockLabel" data-i18n="opt.clock"></span>
          <span class="toggle-hint" data-i18n="opt.clockHint"></span>
        </span>
        <span class="segmented" role="radiogroup" aria-labelledby="clockLabel">
          <label><input type="radio" name="clock" value="24"><span>24 h</span></label>
          <label><input type="radio" name="clock" value="12"><span>12 h (AM/PM)</span></label>
        </span>
      </div>
      <div class="toggle choice">
        <span>
          <span class="toggle-label" id="tempUnitLabel" data-i18n="opt.tempUnit"></span>
          <span class="toggle-hint" data-i18n="opt.tempUnitHint"></span>
        </span>
        <span class="segmented" role="radiogroup" aria-labelledby="tempUnitLabel">
          <label><input type="radio" name="tempUnit" value="c"><span>°C</span></label>
          <label><input type="radio" name="tempUnit" value="f"><span>°F</span></label>
        </span>
      </div>
    </section>

    <h2 class="section-title cities-title" data-i18n="opt.cities"></h2>

    <div class="toolbar">
      <input id="search" type="search" autocomplete="off" data-i18n-attr="placeholder:opt.search; aria-label:opt.searchAria">
      <span id="count" class="count"></span>
      <div class="actions">
        <button id="selectAll" class="btn" type="button" data-i18n="opt.selectAll"></button>
        <button id="selectNone" class="btn" type="button" data-i18n="opt.selectNone"></button>
        <button id="reset" class="btn" type="button" data-i18n="opt.reset"></button>
      </div>
    </div>

    <main id="regions"></main>

    <section class="region custom" aria-labelledby="customTitle">
      <div class="region-head">
        <h2 id="customTitle" data-i18n="opt.custom"></h2>
      </div>
      <div id="customList" class="grid"></div>
      <p id="customEmpty" class="hint" data-i18n="opt.customEmpty"></p>

      <form id="customForm" class="custom-form" novalidate>
        <label><span data-i18n="form.name"></span>
          <input name="name" type="text" required maxlength="40" data-i18n-attr="placeholder:form.namePh">
        </label>
        <label><span data-i18n="form.tz"></span>
          <input name="tz" type="text" required list="tzList" autocomplete="off" data-i18n-attr="placeholder:form.tzPh">
        </label>
        <label><span data-i18n="form.country"></span>
          <select name="country">
            <option value="" data-i18n="form.noFlag"></option>
          </select>
        </label>
        <label><span data-i18n="form.lat"></span>
          <input name="lat" type="number" required step="any" min="-90" max="90" placeholder="53.08">
        </label>
        <label><span data-i18n="form.lon"></span>
          <input name="lon" type="number" required step="any" min="-180" max="180" placeholder="8.80">
        </label>
        <button class="btn primary" type="submit" data-i18n="form.add"></button>
        <p id="formError" class="form-error" role="alert"></p>
      </form>
      <datalist id="tzList"></datalist>
    </section>
  </div>

  <script src="cities.js"></script>
  <script src="options.js"></script>
</body>
</html>
